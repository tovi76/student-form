<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>טופס רישום תלמידים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0f4ff;
      --surface: #ffffff;
      --surface2: #f7f8fc;
      --border: #e2e5f0;
      --accent: #6c63ff;
      --accent2: #5b52e8;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --text: #1e1e2e;
      --text-muted: #6b7280;
      --text-dim: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 60% 40% at 80% 20%, rgba(108,99,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 10% 80%, rgba(99,179,237,0.08) 0%, transparent 50%);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 40px rgba(108,99,255,0.1), 0 2px 8px rgba(0,0,0,0.06);
    }
    .card-header { margin-bottom: 36px; }
    .confetti-row {
      font-size: 22px;
      letter-spacing: 4px;
      margin-bottom: 14px;
      animation: sway 3s ease-in-out infinite;
      display: block;
    }
    @keyframes sway {
      0%,100% { transform: rotate(-2deg); }
      50%      { transform: rotate(2deg); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent2);
      background: rgba(108,99,255,0.1);
      border: 1px solid rgba(108,99,255,0.25);
      border-radius: 100px;
      padding: 4px 12px;
      margin-bottom: 14px;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    h1 { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.3; }
    h1 span { color: var(--accent2); }
    .subtitle { margin-top: 6px; font-size: 13px; color: var(--text-muted); font-weight: 300; }
    .conn-banner {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 10px;
      font-size: 12.5px; font-weight: 500;
      margin-bottom: 28px; border: 1px solid transparent; transition: all 0.3s;
    }
    .conn-banner.loading { background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.2); color: var(--warning); }
    .conn-banner.ok      { background: rgba(52,211,153,0.08); border-color: rgba(52,211,153,0.2); color: var(--success); }
    .conn-banner.error   { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.2); color: var(--error); }
    .conn-icon { font-size: 15px; flex-shrink: 0; }
    .field { margin-bottom: 20px; position: relative; }
    label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 8px;
    }
    label .req { color: var(--accent2); margin-right: 2px; }
    input[type="text"], select {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: 'Heebo', sans-serif;
      font-size: 15px; padding: 12px 16px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }
    input::placeholder { color: var(--text-dim); }
    input:disabled, select:disabled {
      opacity: 0.5; cursor: not-allowed;
    }
    /* Auto-filled field */
    .field-auto input {
      background: rgba(52,211,153,0.06);
      border-color: rgba(52,211,153,0.25);
      color: var(--success);
    }
    .auto-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; color: var(--success);
      background: rgba(52,211,153,0.1);
      border: 1px solid rgba(52,211,153,0.2);
      border-radius: 100px; padding: 2px 8px; margin-right: 8px;
    }
    /* Select styling */
    select { cursor: pointer; }
    select option { background: var(--surface2); color: var(--text); }
    /* Autocomplete */
    .autocomplete-wrap { position: relative; }
    .clear-btn {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 16px; padding: 2px 4px;
      border-radius: 4px; display: none; transition: color 0.15s;
    }
    .clear-btn:hover { color: var(--text-muted); }
    .clear-btn.visible { display: block; }
    .search-icon {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-dim); font-size: 15px; pointer-events: none;
    }
    .dropdown {
      position: absolute; top: calc(100% + 6px); right: 0; left: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; max-height: 220px; overflow-y: auto;
      z-index: 100; box-shadow: 0 12px 40px rgba(0,0,0,0.4); display: none;
    }
    .dropdown.open { display: block; }
    .dropdown::-webkit-scrollbar { width: 4px; }
    .dropdown::-webkit-scrollbar-track { background: transparent; }
    .dropdown::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .drop-item {
      padding: 10px 16px; cursor: pointer; font-size: 14px;
      border-bottom: 1px solid var(--border); transition: background 0.1s;
      display: flex; align-items: center; gap: 8px;
    }
    .drop-item:last-child { border-bottom: none; }
    .drop-item:hover, .drop-item.active { background: rgba(108,99,255,0.12); color: var(--accent2); }
    .drop-item mark { background: rgba(108,99,255,0.3); color: var(--accent2); border-radius: 3px; padding: 0 2px; }
    .drop-empty { padding: 16px; text-align: center; color: var(--text-dim); font-size: 13px; }
    .drop-count { padding: 6px 16px; font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--border); font-weight: 500; }
    .selected-chip {
      display: none; align-items: center; gap: 8px;
      background: rgba(108,99,255,0.12); border: 1px solid rgba(108,99,255,0.3);
      border-radius: 8px; padding: 10px 14px; font-size: 14px;
      color: var(--accent2); margin-top: 6px;
    }
    .selected-chip.visible { display: flex; }
    .chip-remove {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; margin-right: auto; font-size: 14px;
      padding: 0 2px; border-radius: 3px; transition: color 0.15s;
    }
    .chip-remove:hover { color: var(--error); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .refresh-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .refresh-btn {
      display: flex; align-items: center; gap: 5px;
      background: none; border: 1px solid var(--border);
      color: var(--text-muted); font-family: 'Heebo', sans-serif;
      font-size: 12px; padding: 5px 10px; border-radius: 7px;
      cursor: pointer; transition: all 0.15s;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent2); }
    .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .last-updated { font-size: 11px; color: var(--text-dim); }
    .submit-btn {
      width: 100%; padding: 14px;
      background: var(--accent); color: #fff;
      font-family: 'Heebo', sans-serif; font-size: 15px; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      letter-spacing: 0.02em; box-shadow: 0 4px 24px rgba(108,99,255,0.3);
    }
    .submit-btn:hover:not(:disabled) { background: #7c74ff; box-shadow: 0 6px 30px rgba(108,99,255,0.45); }
    .submit-btn:active:not(:disabled) { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      border-radius: 12px; padding: 12px 20px; font-size: 13.5px; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.35s cubic-bezier(.16,1,.3,1);
      z-index: 200; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(52,211,153,0.3); color: var(--success); }
    .toast.error   { border-color: rgba(248,113,113,0.3); color: var(--error); }
    .gear-btn {
      position: fixed; top: 20px; left: 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-muted);
      padding: 8px 10px; cursor: pointer; font-size: 16px; transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .gear-btn:hover { border-color: var(--accent); color: var(--accent2); }
    /* Duplicate name warning */
    .dup-warning {
      font-size: 11.5px; color: var(--warning);
      margin-top: 6px; display: none;
    }
    .dup-warning.visible { display: block; }
  </style>
</head>
<body>

<button class="gear-btn" onclick="openConfig()" title="הגדרות">⚙️</button>

<div class="card">
  <div class="card-header">
    <div class="confetti-row">🎉 🎊 🥳 🎈 🎁 🎊 🎉</div>
    <div class="badge"><span class="dot"></span>Google Sheets Live</div>
    <h1>מזל טוב <span>ל —</span></h1>
    <p class="subtitle">הנתונים נטענים בזמן אמת מגוגל שיטס</p>
  </div>

  <div id="connBanner" class="conn-banner loading">
    <span class="conn-icon">⏳</span>
    <span id="connText">טוען נתונים מ-Google Sheets...</span>
  </div>

  <div class="refresh-row">
    <span class="last-updated" id="lastUpdated">—</span>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.16"/>
      </svg>
      רענן רשימה
    </button>
  </div>

  <!-- שם התלמיד -->
  <div class="field">
    <label><span class="req">*</span> שם התלמיד</label>
    <div class="autocomplete-wrap">
      <div class="input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="studentInput" placeholder="הקלד שם תלמיד..." autocomplete="off"
          oninput="onStudentInput()" onfocus="onStudentFocus()" onkeydown="onStudentKeydown(event)" />
        <button class="clear-btn" id="clearBtn" onclick="clearStudent()">✕</button>
      </div>
      <div class="dropdown" id="dropdown"></div>
    </div>
    <div class="selected-chip" id="selectedChip">
      <span>✓</span><span id="selectedName"></span>
      <button class="chip-remove" onclick="clearStudent()">✕</button>
    </div>
  </div>

  <!-- כיתה -->
  <div class="field" id="fieldClass">
    <label>
      <span class="req">*</span> כיתה
      <span class="auto-badge" id="autoBadge" style="display:none">✓ אוטומטי</span>
    </label>
    <!-- אוטומטי -->
    <input type="text" id="classAuto" readonly disabled placeholder="תיבחר אוטומטית לאחר בחירת תלמיד" style="display:block" />
    <!-- dropdown לשם כפול -->
    <select id="classDup" style="display:none" onchange="onClassDupChange()">
      <option value="">— בחר כיתה —</option>
    </select>
    <div class="dup-warning" id="dupWarning">⚠️ נמצאו מספר תלמידים בשם זה — בחרי את הכיתה המתאימה</div>
  </div>

  <!-- אפשרויות dropdown מעמודה D -->
  <div class="field">
    <label><span class="req">*</span> הארוע</label>
    <select id="reasonSelect" onchange="updateSubmitBtn()">
      <option value="">— בחר —</option>
    </select>
  </div>

  <hr class="divider" />

  <button class="submit-btn" id="submitBtn" onclick="handleSubmit()" disabled>
    שלח טופס ←
  </button>
</div>

<!-- Config Modal -->
<div class="modal-overlay" id="configModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;z-index:300;padding:24px;backdrop-filter:blur(4px)">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px;max-width:480px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.12)">
    <h2 style="font-size:20px;font-weight:700;margin-bottom:8px">⚙️ הגדרות חיבור</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.6">Make Webhook URL לטעינת נתונים</p>
    <input type="text" id="cfgMakeUrl" placeholder="https://hook.eu2.make.com/..." style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:Heebo,monospace;font-size:13px;padding:11px 14px;outline:none;margin-bottom:12px;direction:ltr" />
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;line-height:1.6">Make Webhook URL לשליחת טופס</p>
    <input type="text" id="cfgSubmitUrl" placeholder="https://hook.eu2.make.com/..." style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:Heebo,monospace;font-size:13px;padding:11px 14px;outline:none;margin-bottom:20px;direction:ltr" />
    <div style="display:flex;gap:10px">
      <button onclick="saveConfig()" style="flex:1;padding:11px;background:var(--accent);color:#fff;font-family:Heebo,sans-serif;font-size:14px;font-weight:700;border:none;border-radius:9px;cursor:pointer">שמור</button>
      <button onclick="closeConfig()" style="padding:11px 18px;background:none;color:var(--text-muted);font-family:Heebo,sans-serif;font-size:14px;border:1px solid var(--border);border-radius:9px;cursor:pointer">ביטול</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────
let config = {
  makeUrl:   'https://hook.eu2.make.com/quev0zz59whstoi8v9068tcyx33jm2ax',
  submitUrl: ''  // ← Webhook לשליחה (Scenario 2)
};

function loadConfig() {
  const saved = localStorage.getItem('gsform_config2');
  if (saved) Object.assign(config, JSON.parse(saved));
}

function saveConfig() {
  config.makeUrl   = document.getElementById('cfgMakeUrl').value.trim() || config.makeUrl;
  config.submitUrl = document.getElementById('cfgSubmitUrl').value.trim();
  localStorage.setItem('gsform_config2', JSON.stringify(config));
  closeConfig();
  loadData();
}

function openConfig() {
  document.getElementById('cfgMakeUrl').value   = config.makeUrl;
  document.getElementById('cfgSubmitUrl').value = config.submitUrl;
  document.getElementById('configModal').style.display = 'flex';
}
function closeConfig() {
  document.getElementById('configModal').style.display = 'none';
}

// ── Data ──────────────────────────────────────────────────────
// allStudents: [{name, class}]
// reasons: [string]
let allStudents = [];
let reasons     = [];
let selectedStudent = null;  // {name, class} or null
let dropActiveIdx   = -1;
let currentQuery    = '';
let filtered        = [];

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  setBanner('loading', '⏳', 'טוען נתונים מ-Google Sheets...');

  try {
    const res = await fetch(config.makeUrl + '?action=getStudents', { signal: AbortSignal.timeout(10000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    // תלמידים: [{name, cls}] — "0"=שם, "1"=כיתה
    const raw = json.students ?? [];
    allStudents = raw
      .map(v => ({
        name: typeof v === 'object' ? (v['0'] ?? '') : v,
        cls:  typeof v === 'object' ? (v['1'] ?? '') : ''
      }))
      .filter(s => s.name && s.name.trim());

    // אפשרויות מעמודה D ("3") — ייחודיות, ללא null
    reasons = raw
      .map(v => typeof v === 'object' ? v['3'] : null)
      .filter(r => r && String(r).trim())
      .filter((v, i, a) => a.indexOf(v) === i);

    if (!allStudents.length) throw new Error('EMPTY');

    // מלא dropdown אפשרויות
    fillReasons();

    setBanner('ok', '✅', `נטענו ${allStudents.length} תלמידים | ${reasons.length} אפשרויות`);
    setLastUpdated();
  } catch (err) {
    if (err.message === 'EMPTY') {
      setBanner('error', '⚠️', 'הגיליון ריק — בדוק את הטווח');
    } else {
      setBanner('error', '❌', 'שגיאת חיבור — בדוק את Make Webhook');
    }
  } finally {
    btn.classList.remove('spinning');
  }
}

function fillReasons() {
  const sel = document.getElementById('reasonSelect');
  sel.innerHTML = '<option value="">— בחר —</option>';
  reasons.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    sel.appendChild(opt);
  });
}

// ── Fuzzy search ──────────────────────────────────────────────
function fuzzyScore(name, query) {
  const n = name.toLowerCase(), q = query.toLowerCase();
  let ni = 0, qi = 0, score = 0;
  while (ni < n.length && qi < q.length) {
    if (n[ni] === q[qi]) { score++; qi++; }
    ni++;
  }
  return qi === q.length ? score : -1;
}

function highlightMatch(text, query) {
  if (!query) return text;
  let result = '', qi = 0;
  const tl = text.toLowerCase(), ql = query.toLowerCase();
  for (let i = 0; i < text.length; i++) {
    if (qi < ql.length && tl[i] === ql[qi]) { result += `<mark>${text[i]}</mark>`; qi++; }
    else result += text[i];
  }
  return result;
}

function filterStudents(query) {
  // קבץ לפי שם ייחודי
  const unique = [...new Map(allStudents.map(s => [s.name, s])).values()];
  if (!query) return unique.slice(0, 50);
  return unique
    .map(s => ({ s, score: fuzzyScore(s.name, query) }))
    .filter(x => x.score >= 0)
    .sort((a, b) => b.score - a.score)
    .map(x => x.s);
}

// ── Autocomplete UI ───────────────────────────────────────────
function onStudentInput() {
  const val = document.getElementById('studentInput').value;
  currentQuery = val;
  document.getElementById('clearBtn').classList.toggle('visible', !!val);
  if (selectedStudent) { selectedStudent = null; updateClassField(); updateSubmitBtn(); }
  renderDropdown();
}

function onStudentFocus() {
  if (!selectedStudent) renderDropdown();
}

function renderDropdown() {
  const dd = document.getElementById('dropdown');
  filtered = filterStudents(currentQuery);
  dropActiveIdx = -1;

  if (!filtered.length) {
    dd.innerHTML = `<div class="drop-empty">לא נמצאו תלמידים התואמים "${currentQuery}"</div>`;
  } else {
    const countHtml = `<div class="drop-count">${filtered.length} תוצאות</div>`;
    const items = filtered.map((s, i) =>
      `<div class="drop-item" data-i="${i}" onmousedown="selectStudentByName('${s.name.replace(/'/g,"\\'")}')">
        <span>👤</span><span>${highlightMatch(s.name, currentQuery)}</span>
      </div>`
    ).join('');
    dd.innerHTML = countHtml + items;
  }
  dd.classList.add('open');
}

function onStudentKeydown(e) {
  const dd = document.getElementById('dropdown');
  if (!dd.classList.contains('open')) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); dropActiveIdx = Math.min(dropActiveIdx+1, filtered.length-1); highlightActive(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); dropActiveIdx = Math.max(dropActiveIdx-1, 0); highlightActive(); }
  else if (e.key === 'Enter' && dropActiveIdx >= 0) { e.preventDefault(); selectStudentByName(filtered[dropActiveIdx].name); }
  else if (e.key === 'Escape') closeDropdown();
}

function highlightActive() {
  const items = document.querySelectorAll('.drop-item');
  items.forEach((el, i) => el.classList.toggle('active', i === dropActiveIdx));
  if (items[dropActiveIdx]) items[dropActiveIdx].scrollIntoView({ block: 'nearest' });
}

function selectStudentByName(name) {
  // חפש כמה תלמידים עם אותו שם
  const matches = allStudents.filter(s => s.name === name);

  if (matches.length === 1) {
    // שם ייחודי — מלא אוטומטי
    selectedStudent = matches[0];
    showClassAuto(selectedStudent.cls);
  } else {
    // שם כפול — הצג dropdown כיתות
    selectedStudent = { name, cls: '' };
    showClassDup(matches);
  }

  document.getElementById('studentInput').value = '';
  currentQuery = '';
  document.getElementById('clearBtn').classList.remove('visible');
  closeDropdown();
  updateChip(name);
  updateSubmitBtn();
}

function showClassAuto(cls) {
  document.getElementById('classAuto').value   = cls || '—';
  document.getElementById('classAuto').style.display  = 'block';
  document.getElementById('classDup').style.display   = 'none';
  document.getElementById('autoBadge').style.display  = 'inline-flex';
  document.getElementById('dupWarning').classList.remove('visible');
  document.getElementById('fieldClass').classList.add('field-auto');
}

function showClassDup(matches) {
  const sel = document.getElementById('classDup');
  sel.innerHTML = '<option value="">— בחר כיתה —</option>';
  matches.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.cls; opt.textContent = m.cls || 'לא ידוע';
    sel.appendChild(opt);
  });
  document.getElementById('classAuto').style.display  = 'none';
  document.getElementById('classDup').style.display   = 'block';
  document.getElementById('autoBadge').style.display  = 'none';
  document.getElementById('dupWarning').classList.add('visible');
  document.getElementById('fieldClass').classList.remove('field-auto');
}

function onClassDupChange() {
  const val = document.getElementById('classDup').value;
  if (selectedStudent) selectedStudent.cls = val;
  if (val) document.getElementById('dupWarning').classList.remove('visible');
  updateSubmitBtn();
}

function updateClassField() {
  document.getElementById('classAuto').value  = '';
  document.getElementById('classAuto').style.display = 'block';
  document.getElementById('classDup').style.display  = 'none';
  document.getElementById('autoBadge').style.display = 'none';
  document.getElementById('dupWarning').classList.remove('visible');
  document.getElementById('fieldClass').classList.remove('field-auto');
}

function clearStudent() {
  selectedStudent = null;
  document.getElementById('studentInput').value = '';
  currentQuery = '';
  document.getElementById('clearBtn').classList.remove('visible');
  updateChip(null);
  updateClassField();
  updateSubmitBtn();
  closeDropdown();
}

function updateChip(name) {
  const chip = document.getElementById('selectedChip');
  const nameEl = document.getElementById('selectedName');
  if (name) {
    chip.classList.add('visible');
    nameEl.textContent = name;
    document.getElementById('studentInput').placeholder = 'שנה בחירה...';
  } else {
    chip.classList.remove('visible');
    document.getElementById('studentInput').placeholder = 'הקלד שם תלמיד...';
  }
}

function closeDropdown() {
  document.getElementById('dropdown').classList.remove('open');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.autocomplete-wrap')) closeDropdown();
});

// ── Submit ────────────────────────────────────────────────────
function updateSubmitBtn() {
  const hasStudent = !!selectedStudent?.name;
  const hasClass   = !!selectedStudent?.cls || document.getElementById('classAuto').value;
  const hasReason  = !!document.getElementById('reasonSelect').value;
  // אם שם כפול — צריך לבחור כיתה
  const dupVisible = document.getElementById('classDup').style.display !== 'none';
  const dupOk      = !dupVisible || !!document.getElementById('classDup').value;
  document.getElementById('submitBtn').disabled = !(hasStudent && dupOk && hasReason);
}

document.getElementById('reasonSelect').addEventListener('change', updateSubmitBtn);

async function handleSubmit() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ שולח...';

  const payload = {
    student: selectedStudent?.name,
    class:   selectedStudent?.cls || document.getElementById('classAuto').value,
    reason:  document.getElementById('reasonSelect').value,
    timestamp: new Date().toISOString()
  };

  try {
    if (!config.submitUrl) {
      // Demo mode
      showToast('success', `✅ Demo: ${payload.student} | ${payload.class} | ${payload.reason}`);
      console.log('Payload:', payload);
      resetForm();
      return;
    }

    const res = await fetch(config.submitUrl, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'application/json' }
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    showToast('success', '✅ הטופס נשלח בהצלחה!');
    resetForm();
  } catch (err) {
    showToast('error', `❌ שגיאה בשליחה: ${err.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = 'שלח טופס ←';
    updateSubmitBtn();
  }
}

function resetForm() {
  clearStudent();
  document.getElementById('reasonSelect').value = '';
  updateSubmitBtn();
}

// ── Helpers ───────────────────────────────────────────────────
function setBanner(type, icon, text) {
  const b = document.getElementById('connBanner');
  b.className = `conn-banner ${type}`;
  b.querySelector('.conn-icon').textContent = icon;
  document.getElementById('connText').textContent = text;
}

function setLastUpdated() {
  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    `עודכן: ${now.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'})}`;
}

function showToast(type, msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ── Init ──────────────────────────────────────────────────────
loadConfig();
loadData();
</script>
</body>
</html>
